<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근현대전 파노라마</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
        }

        /* 세로 화면 안내 */
        #orientationWarning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #111;
            color: white;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 30px;
        }

        @media screen and (orientation: portrait) {
            #orientationWarning {
                display: flex;
            }
        }

        /* 시작 화면 */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;

            background:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
                url("map.jpg") center/cover no-repeat;
        }

        #startScreen h1 {
            color: white;
            font-size: clamp(30px, 4vw, 50px);
            margin: 0 0 20px;
            text-shadow: 2px 2px 5px #000;
        }

        .startButton {
            width: min(350px, 70vw);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 12px;

            background: rgba(20,20,20,0.75);
            color: white;

            font-size: 22px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.2s;
        }

        .startButton:hover {
            background: rgba(70,70,70,0.9);
            transform: scale(1.03);
        }

        /* 파노라마 화면 */
        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #viewer canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 파노라마 내비게이션 핀 */
        #pinLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .panoramaPin {
            position: absolute;
            transform: translate(-50%, -50%);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;

            padding: 0;
            border: none;
            background: none;

            cursor: pointer;
            pointer-events: auto;
        }

        .panoramaPin .pinIcon {
            font-size: 38px;
            filter: drop-shadow(0 2px 4px black);
        }

        .panoramaPin .pinLabel {
            padding: 6px 10px;
            border-radius: 6px;

            background: rgba(0,0,0,0.75);
            color: white;

            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .panoramaPin:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        /* 상단 버튼 */
        .topButton {
            position: fixed;
            top: 25px;
            z-index: 50;

            padding: 12px 20px;
            border: none;
            border-radius: 10px;

            background: rgba(0,0,0,0.7);
            color: white;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #backButton {
            display: none;
            left: 25px;
        }

        #homeButton {
            display: none;
            left: 150px;
        }

        #infoButton {
            display: none;
            right: 25px;
        }

        /* 정보 팝업 */
        #infoPanel {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 200;

            width: min(700px, 85%);
            max-height: 85vh;
            overflow-y: auto;

            padding: clamp(25px, 4vw, 45px);

            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);

            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -50%) scale(0.9);

            transition: 0.3s;
        }

        #infoPanel.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        #infoImage {
            float: left;
            width: 180px;
            height: 220px;
            margin: 0 30px 20px 0;

            object-fit: cover;
            border-radius: 12px;
        }

        #infoTitle {
            margin-top: 10px;
            color: #222;
            font-size: 28px;
        }

        #infoDescription {
            color: #555;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-line;
        }

        #detailButton {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;

            background: #333;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        #detailButton:hover {
            background: #555;
        }

        #infoClose {
            position: absolute;
            top: 12px;
            right: 18px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;
            background: #eee;

            color: #555;
            font-size: 28px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #infoPanel {
                width: 90%;
                padding: 25px;
            }

            #infoImage {
                float: none;
                display: block;
                width: 140px;
                height: 170px;
                margin: 0 auto 20px;
            }

            #infoTitle {
                font-size: 23px;
            }

            #homeButton {
                left: 125px;
            }

            .topButton {
                padding: 10px 13px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div id="orientationWarning">
        <div style="font-size:60px;">📱</div>
        <h2>기기를 가로로 돌려주세요</h2>
        <p>원활한 파노라마 체험을 위해 가로 모드를 지원합니다.</p>
    </div>

    <!-- 시작 화면 -->
    <div id="startScreen">
        <h1>장소를 선택하세요</h1>

        <button class="startButton" data-start="hyeonchungmun">
            1. 현충원
        </button>

        <button class="startButton" data-start="westSquare">
            2. 대전역
        </button>

        <button class="startButton" data-start="memorialTower">
            3. 대전형무소
        </button>
    </div>

    <!-- 파노라마 화면 -->
    <div id="viewer">
        <div id="pinLayer"></div>
    </div>

    <!-- 상단 버튼 -->
    <button id="backButton" class="topButton">← 돌아가기</button>
    <button id="homeButton" class="topButton">⌂ 처음으로</button>
    <button id="infoButton" class="topButton">ⓘ 정보</button>

    <!-- 장소 정보 팝업 -->
    <div id="infoPanel">

        <button id="infoClose">×</button>

        <img id="infoImage" src="" alt="장소 사진">

        <h2 id="infoTitle"></h2>

        <p id="infoDescription"></p>

        <a
            id="detailButton"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            자세히 알아보기
        </a>

    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
