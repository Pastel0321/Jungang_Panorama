<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근현대전 파노라마</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", sans-serif;
        }

        /* 세로 화면 안내 */
        #orientationWarning {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #111;
            color: white;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 30px;
        }

        @media screen and (orientation: portrait) {
            #orientationWarning {
                display: flex;
            }
        }

        /* =========================
   메인 홈 화면
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: grid;
    grid-template-columns: minmax(0, 6fr) minmax(0, 4fr);

    width: 100%;
    height: 100%;
    overflow: hidden;

    background: url("map.jpg") center / cover no-repeat;
}


/* =========================
   왼쪽 영역
========================= */

#homeLeft {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: clamp(20px, 4vw, 55px);
}

#homeLeft h1 {
    position: fixed;
    left: 30%;
    top: 10%;
    transform: translate(-50%, -50%);

    width: 55%;
    margin: 0;

    color: white;
    font-size: clamp(25px, 3.5vw, 48px);
    font-weight: 900;
    line-height: 1.35;
    text-align: center;

    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}


/* 지도 이미지 */

#mapImageBox {
    width: 100%;
    flex: 1;
    min-height: 0;

    display: flex;
    justify-content: center;
    align-items: center;
}

#daejeonMap {
    display: block;

    width: min(100%, 850px);
    height: 100%;

    object-fit: contain;

    transform: translateY(20px);

    user-select: none;
    pointer-events: none;
}


/* =========================
   오른쪽 영역
========================= */

#homeRight {
    min-width: 0;
    min-height: 0;

    padding: clamp(12px, 1.8vw, 25px);

    background: rgba(120, 120, 120, 0.75);

    overflow: hidden;
}


/* 장소 카드 목록 */

#placeList {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    gap: clamp(10px, 1.5vh, 18px);

    overflow-y: auto;
    overflow-x: hidden;

    padding: 3px;
}


/* =========================
   장소 카드
========================= */

.placeCard {
    width: 100%;
    min-height: 0;
    flex: 1 0 120px;

    display: flex;
    align-items: center;

    gap: clamp(10px, 1.2vw, 18px);

    padding: clamp(10px, 1.2vw, 16px);

    border: none;
    border-radius: 16px;

    background: white;

    text-align: left;
    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.placeCard:hover {
    transform: translateY(-3px);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.2);
}

.placeCard:active {
    transform: scale(0.98);
}


/* 카드 대표 사진 */

.placeCard img {
    width: clamp(75px, 9vw, 145px);
    height: 100%;

    min-height: 85px;
    max-height: 150px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 10px;
}


/* 카드 설명 */

.placeText {
    min-width: 0;
    flex: 1;
}

.placeText h2 {
    margin: 0 0 8px;

    color: #222;

    font-size: clamp(16px, 1.5vw, 23px);
    font-weight: 800;
}

.placeText p {
    margin: 0;

    color: #666;

    font-size: clamp(11px, 1vw, 15px);
    line-height: 1.5;

    word-break: keep-all;
}


/* =========================
   화면 비율 대응
========================= */

/* 가로 화면이면서 높이가 낮은 경우 */
@media (orientation: landscape) and (max-height: 550px) {

    #homeLeft {
        padding: 12px 25px;
    }

    #homeLeft h1 {
        font-size: clamp(20px, 3vw, 30px);
        margin-bottom: 8px;
    }

    #homeRight {
        padding: 10px;
    }

    #placeList {
        gap: 7px;
    }

    .placeCard {
        flex-basis: 95px;
        padding: 7px;
    }

    .placeCard img {
        width: 75px;
        min-height: 65px;
    }

    .placeText h2 {
        font-size: 15px;
        margin-bottom: 4px;
    }

    .placeText p {
        font-size: 11px;
    }

}
        /* 파노라마 화면 */
        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #viewer canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 파노라마 내비게이션 핀 */
        #pinLayer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .panoramaPin {
            position: absolute;
            transform: translate(-50%, -50%);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;

            padding: 0;
            border: none;
            background: none;

            cursor: pointer;
            pointer-events: auto;
        }

        .panoramaPin .pinIcon {
            font-size: 38px;
            filter: drop-shadow(0 2px 4px black);
        }

        .panoramaPin .pinLabel {
            padding: 6px 10px;
            border-radius: 6px;

            background: rgba(0,0,0,0.75);
            color: white;

            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .panoramaPin:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        /* 상단 버튼 */
        .topButton {
            position: fixed;
            top: 25px;
            z-index: 50;

            padding: 12px 20px;
            border: none;
            border-radius: 10px;

            background: rgba(0,0,0,0.7);
            color: white;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #backButton {
            display: none;
            left: 25px;
        }

        #homeButton {
            display: none;
            left: 150px;
        }

        #infoButton {
            display: none;
            right: 25px;
        }

        /* 정보 팝업 */
        #infoPanel {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 200;

            width: min(700px, 85%);
            max-height: 85vh;
            overflow-y: auto;

            padding: clamp(25px, 4vw, 45px);

            background: white;
            border-radius: 25px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);

            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -50%) scale(0.9);

            transition: 0.3s;
        }

        #infoPanel.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        #infoImage {
            float: left;
            width: 180px;
            height: 220px;
            margin: 0 30px 20px 0;

            object-fit: cover;
            border-radius: 12px;
        }

        #infoTitle {
            margin-top: 10px;
            color: #222;
            font-size: 28px;
        }

        #infoDescription {
            color: #555;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-line;
        }

        #detailButton {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;

            background: #333;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        #detailButton:hover {
            background: #555;
        }

        #infoClose {
            position: absolute;
            top: 12px;
            right: 18px;

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;
            background: #eee;

            color: #555;
            font-size: 28px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #infoPanel {
                width: 90%;
                padding: 25px;
            }

            #infoImage {
                float: none;
                display: block;
                width: 140px;
                height: 170px;
                margin: 0 auto 20px;
            }

            #infoTitle {
                font-size: 23px;
            }

            #homeButton {
                left: 125px;
            }

            .topButton {
                padding: 10px 13px;
                font-size: 14px;
            }
        }

        /* 서광장 돋보기 이미지 */
.imagePin {
    padding: 0;
    background: none;
}

.imagePin img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
}

/* 서광장 이미지 팝업 */
#westSquarePopup {
    position: fixed;
    inset: 0;
    z-index: 300;

    display: none;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.7);
    padding: 30px;
}

#westSquarePopup.active {
    display: flex;
}

#westSquarePopup img {
    display: block;

    max-width: 90%;
    max-height: 85%;

    object-fit: contain;
    border-radius: 12px;
}
    </style>
</head>

<body>

    <div id="orientationWarning">
        <div style="font-size:60px;">📱</div>
        <h2>기기를 가로로 돌려주세요</h2>
        <p>원활한 파노라마 체험을 위해 가로 모드를 지원합니다.</p>
    </div>

    <!-- 시작 화면 -->
    <!-- =========================
     메인 홈 화면
========================= -->

<div id="startScreen">

    <!-- 왼쪽 영역 -->
    <section id="homeLeft">

        <h1>
            대전으로 떠나는<br>
            근현대전 파노라마
        </h1>

        <div id="mapImageBox">
            <img
                src="daejeonmap.png"
                alt="대전 지도와 장소 위치"
                id="daejeonMap"
            >
        </div>

    </section>


    <!-- 오른쪽 영역 -->
    <section id="homeRight">

        <div id="placeList">

            <!-- 현충원 -->
            <button
                class="placeCard"
                data-start="hyeonchungmun"
                type="button"
            >
                <img
                    src="hyeonchungwon.png"
                    alt="현충원"
                >

                <div class="placeText">
                    <h2>현충원</h2>
                    <p>
                        나라를 위해 희생한 순국선열과
                        호국영령을 기리는 공간
                    </p>
                </div>
            </button>


            <!-- 대전역 -->
            <button
                class="placeCard"
                data-start="westSquare"
                type="button"
            >
                <img
                    src="daejeonstation.png"
                    alt="대전역"
                >

                <div class="placeText">
                    <h2>대전역</h2>
                    <p>
                        대전의 철도 교통과 도시 발전의
                        중심이 된 장소
                    </p>
                </div>
            </button>


            <!-- 대전형무소 -->
            <button
                class="placeCard"
                data-start="memorialTower"
                type="button"
            >
                <img
                    src="memorialTower.png"
                    alt="대전형무소"
                >

                <div class="placeText">
                    <h2>대전형무소</h2>
                    <p>
                        대전형무소의 역사와
                        아픈 기억을 간직한 장소
                    </p>
                </div>
            </button>


            <!-- 소제동 -->
            <button
                class="placeCard"
                data-start="sojedongRailwayVillage"
                type="button"
            >
                <img
                    src="sojedong.png"
                    alt="소제동"
                >

                <div class="placeText">
                    <h2>소제동</h2>
                    <p>
                        대전의 근현대 역사와
                        철도 문화가 남아 있는 지역
                    </p>
                </div>
            </button>

        </div>

    </section>

</div>

    <!-- 파노라마 화면 -->
    <div id="viewer">
        <div id="pinLayer"></div>
    </div>

    <!-- 상단 버튼 -->
    <button id="backButton" class="topButton">← 돌아가기</button>
    <button id="homeButton" class="topButton">⌂ 처음으로</button>
    <button id="infoButton" class="topButton">ⓘ 정보</button>

    <!-- 장소 정보 팝업 -->
    <div id="infoPanel">

        <button id="infoClose">×</button>

        <img id="infoImage" src="" alt="장소 사진">

        <h2 id="infoTitle"></h2>

        <p id="infoDescription"></p>

        <a
            id="detailButton"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            자세히 알아보기
        </a>

    </div>

    <!-- 서광장 이미지 팝업 -->
<div id="westSquarePopup">
    <img src="westSquareInfo.png" alt="대전역 서광장 안내 이미지">
</div>

    <script type="module" src="script.js"></script>

</body>
</html>
